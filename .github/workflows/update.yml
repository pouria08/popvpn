name: Auto Update Subscriptions

on:
  # اجرای خودکار یک بار در هر ساعت
  # دقیقه 17 انتخاب شده تا از شلوغی رأس ساعت جلوگیری شود.
  schedule:
    - cron: '17 * * * *'

  # امکان اجرای دستی از GitHub Actions
  workflow_dispatch:

# اجازه لازم برای Commit کردن فایل‌های جدید
permissions:
  contents: write

# جلوگیری از اجرای همزمان چند آپدیت
concurrency:
  group: auto-update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # تست واقعی اتصال چند دقیقه زمان می‌برد، پس مهلت بیشتری
    # نسبت به حالت قبل لازم است.
    timeout-minutes: 20

    steps:

      # دریافت آخرین نسخه Repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # نصب Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # نصب وابستگی‌ها
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # اجرای اسکریپت آپدیت
      #
      # POPVPN_TEST=1        تست واقعی اتصال فعال باشد
      # POPVPN_STRICT=1      فیلتر کیفیت فعال باشد
      # POPVPN_TEST_WORKERS  تعداد اتصال هم‌زمان
      # POPVPN_TEST_TIMEOUT  مهلت هر اتصال (ثانیه)
      - name: Run update script
        env:
          POPVPN_TEST: '1'
          POPVPN_STRICT: '1'
          POPVPN_TEST_WORKERS: '150'
          POPVPN_TEST_TIMEOUT: '3'
        run: |
          python main.py

      # بررسی اینکه خروجی‌ها واقعاً ساخته شده‌اند
      - name: Verify generated files
        run: |
          test -f working_configs.txt
          test -f base64.txt
          test -f stats.txt
          test -f outputs/clash.yaml
          test -f outputs/singbox.json

          # پروفایل‌های کلاینت باید واقعاً قابل Parse باشند،
          # وگرنه کاربر یک Subscription خراب دریافت می‌کند.
          python -c "import json; json.load(open('outputs/singbox.json'))"

          python - <<'PY'
          import yaml

          with open("outputs/clash.yaml", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)

          assert data.get("proxies"), "clash.yaml has no proxies"

          names = {proxy["name"] for proxy in data["proxies"]}

          for group in data.get("proxy-groups", []):
              unknown = set(group["proxies"]) - names - {
                  g["name"] for g in data["proxy-groups"]
              }
              assert not unknown, f"unknown proxies: {unknown}"

          print(f"clash.yaml OK — {len(data['proxies'])} proxies")
          PY

          echo "================================"
          echo "UPDATE RESULT"
          echo "================================"

          cat stats.txt

          echo "================================"

      # Commit فقط در صورت تغییر
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add working_configs.txt
          git add base64.txt
          git add outputs/
          git add stats.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          STATS="$(cat stats.txt | tr '\n' ' ' | cut -c1-200)"

          git commit -m "Auto-Update: ${STATS}"

          git push
